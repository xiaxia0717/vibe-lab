<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>手机当摄像头</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#eee;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
#app{position:fixed;top:0;left:0;width:100%;height:100%;
  display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column}
#preview{-webkit-box-flex:1;-webkit-flex:1 1 auto;flex:1 1 auto;
  width:100%;height:1px;min-height:0;object-fit:contain;background:#000}
#hud{position:absolute;top:0;left:0;right:0;padding:12px 14px;font-size:12px;
  background:rgba(0,0,0,.45);pointer-events:none;overflow:hidden}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;
  background:rgba(255,255,255,.16);float:right}
.badge:first-child{float:left}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#8a8a8a;margin-right:6px;vertical-align:middle}
.dot.on{background:#4ade80}
.dot.err{background:#f87171}
#bar{padding:12px 14px 16px;background:#141414}
.row{display:-webkit-box;display:-webkit-flex;display:flex;margin-top:10px}
.row:first-child{margin-top:0}
.row>*{margin-right:10px}
.row>*:last-child{margin-right:0}
button{-webkit-box-flex:1;-webkit-flex:1 1 0;flex:1 1 0;padding:13px 6px;border:0;
  border-radius:12px;font-size:14px;font-weight:500;background:#262626;color:#eee;
  font-family:inherit;cursor:pointer}
button:active{background:#333}
button.primary{background:#2563eb;color:#fff}
button.on{background:#16a34a;color:#fff}
button:disabled{opacity:.35}
select{-webkit-box-flex:1;-webkit-flex:1 1 0;flex:1 1 0;padding:10px;
  border-radius:10px;background:#262626;color:#eee;border:0;font-size:13px;
  font-family:inherit;text-align:center}
#log{font-size:11px;color:#8a8a8a;height:15px;overflow:hidden;text-align:center;
  text-overflow:ellipsis;white-space:nowrap;margin-top:10px}
</style>
</head>
<body>
<div id="app">
  <video id="preview" autoplay playsinline muted></video>
  <div id="hud">
    <span class="badge"><span class="dot" id="connDot"></span><span id="connText">未连接</span></span>
    <span class="badge" id="fpsBadge">-- fps</span>
  </div>
  <div id="bar">
    <div class="row">
      <select id="quality">
        <option value="640x480">流畅 480p</option>
        <option value="1280x720" selected>高清 720p</option>
        <option value="1920x1080">超清 1080p</option>
      </select>
      <select id="fpsSel">
        <option value="15">15 fps</option>
        <option value="24" selected>24 fps</option>
        <option value="30">30 fps</option>
      </select>
    </div>
    <div class="row">
      <button id="btnStart" class="primary">开始</button>
      <button id="btnSwitch">切换镜头</button>
    </div>
    <div class="row">
      <button id="btnMic" class="on">麦克风 开</button>
      <button id="btnSpeaker" class="on">扬声器 开</button>
    </div>
    <div id="log">点击「开始」授权摄像头与麦克风</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const video = $('preview');
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { alpha: false });

const PCM_RATE = 16000;
const TAG_VIDEO = 0x01;
const TAG_AUDIO = 0x02;

let ws = null;
let stream = null;
let audioCtx = null;
let workletNode = null;
let micStream = null;
let facing = 'environment';
let running = false;
let micOn = true;
let speakerOn = true;
let sendTimer = null;
let jpegBusy = false;
let frameCount = 0;
let lastFpsAt = performance.now();
let playTime = 0;
let wakeLock = null;
let reconnectTimer = null;

function log(m) { $('log').textContent = m; }

function setConn(state, text) {
  $('connDot').className = 'dot' + (state === 'ok' ? ' on' : state === 'err' ? ' err' : '');
  $('connText').textContent = text;
}

/* ---------------- WebSocket ---------------- */
function connect() {
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.binaryType = 'arraybuffer';

  ws.onopen = () => { setConn('ok', '已连接'); log('已连接电脑，画面正在传输'); };
  ws.onerror = () => setConn('err', '连接错误');
  ws.onclose = () => {
    setConn('', '已断开');
    log('连接断开，3 秒后自动重连');
    reconnectTimer = setTimeout(connect, 3000);
  };
  ws.onmessage = ev => {
    if (typeof ev.data === 'string') return;
    const buf = new Uint8Array(ev.data);
    if (buf[0] === TAG_AUDIO && speakerOn) playPCM(buf.subarray(1));
  };
}

/* ---------------- 音频播放（电脑声音 -> 手机扬声器） ---------------- */
function playPCM(bytes) {
  if (!audioCtx || audioCtx.state !== 'running') return;
  const n = bytes.length >> 1;
  if (n === 0) return;
  const view = new DataView(bytes.buffer, bytes.byteOffset, n * 2);
  const f32 = new Float32Array(n);
  for (let i = 0; i < n; i++) f32[i] = view.getInt16(i * 2, true) / 32768;
  const buf = audioCtx.createBuffer(1, n, PCM_RATE);
  buf.copyToChannel(f32, 0);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  if (playTime < now + 0.04) playTime = now + 0.08;
  if (playTime - now > 0.6) return;
  src.start(playTime);
  playTime += buf.duration;
}

/* ---------------- 摄像头 ---------------- */
async function openCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  const [w, h] = $('quality').value.split('x').map(Number);
  stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: { ideal: facing },
      width: { ideal: w },
      height: { ideal: h },
      frameRate: { ideal: Number($('fpsSel').value) }
    },
    audio: false
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = w;
  canvas.height = h;
}

/* ---------------- 麦克风 ---------------- */
const WORKLET_SRC = `
class CaptureProcessor extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch && ch.length) {
      const i16 = new Int16Array(ch.length);
      for (let i = 0; i < ch.length; i++) {
        let s = ch[i];
        if (s > 1) s = 1; else if (s < -1) s = -1;
        i16[i] = s * 32767;
      }
      this.port.postMessage(i16.buffer, [i16.buffer]);
    }
    return true;
  }
}
registerProcessor('capture-processor', CaptureProcessor);
`;

async function openMic() {
  if (audioCtx) return;
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  audioCtx = new AudioContext({ sampleRate: PCM_RATE });
  const src = audioCtx.createMediaStreamSource(micStream);
  const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
  await audioCtx.audioWorklet.addModule(url);
  workletNode = new AudioWorkletNode(audioCtx, 'capture-processor');
  workletNode.port.onmessage = e => {
    if (!micOn || !ws || ws.readyState !== 1) return;
    const pcm = new Uint8Array(e.data);
    const pkt = new Uint8Array(pcm.length + 1);
    pkt[0] = TAG_AUDIO;
    pkt.set(pcm, 1);
    ws.send(pkt);
  };
  const mute = audioCtx.createGain();
  mute.gain.value = 0;
  src.connect(workletNode);
  workletNode.connect(mute);
  mute.connect(audioCtx.destination);
}

/* ---------------- 视频推流 ---------------- */
function startPush() {
  const fps = Number($('fpsSel').value);
  if (sendTimer) clearInterval(sendTimer);
  sendTimer = setInterval(grabFrame, Math.round(1000 / fps));
}

function grabFrame() {
  if (!running || jpegBusy) return;
  if (!ws || ws.readyState !== 1 || video.readyState < 2 || !video.videoWidth) return;
  jpegBusy = true;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  canvas.toBlob(blob => {
    jpegBusy = false;
    if (!blob || !ws || ws.readyState !== 1) return;
    blob.arrayBuffer().then(ab => {
      if (!ws || ws.readyState !== 1) return;
      const pkt = new Uint8Array(ab.byteLength + 1);
      pkt[0] = TAG_VIDEO;
      pkt.set(new Uint8Array(ab), 1);
      ws.send(pkt);
      frameCount++;
      const now = performance.now();
      if (now - lastFpsAt >= 1000) {
        $('fpsBadge').textContent = Math.round(frameCount * 1000 / (now - lastFpsAt)) + ' fps';
        frameCount = 0;
        lastFpsAt = now;
      }
    });
  }, 'image/jpeg', 0.65);
}

/* ---------------- 屏幕常亮 ---------------- */
async function keepAwake() {
  try {
    if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
  } catch (e) { /* 忽略 */ }
}

/* ---------------- 启动 / 停止 ---------------- */
async function start() {
  try {
    log('正在请求摄像头权限…');
    await openCamera();
    log('正在请求麦克风权限…');
    try { await openMic(); } catch (e) { log('麦克风不可用：' + e.message); }
    if (!ws || ws.readyState > 1) connect();
    running = true;
    startPush();
    keepAwake();
    $('btnStart').textContent = '停止';
    $('btnStart').className = '';
    log('运行中 — 保持此页面在前台');
  } catch (e) {
    log('启动失败：' + (e && e.message ? e.message : e));
    setConn('err', '启动失败');
  }
}

function stop() {
  running = false;
  if (sendTimer) { clearInterval(sendTimer); sendTimer = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (workletNode) { try { workletNode.disconnect(); } catch (e) {} workletNode = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
  $('fpsBadge').textContent = '-- fps';
  $('btnStart').textContent = '开始';
  $('btnStart').className = 'primary';
  log('已停止');
}

/* ---------------- 交互 ---------------- */
$('btnStart').onclick = () => { running ? stop() : start(); };

$('btnSwitch').onclick = async () => {
  facing = facing === 'environment' ? 'user' : 'front';
  if (facing === 'front') facing = 'user';
  if (!running) return;
  log('切换镜头…');
  await openCamera();
  log(facing === 'user' ? '已切换到前置摄像头' : '已切换到后置摄像头');
};

$('btnMic').onclick = () => {
  micOn = !micOn;
  $('btnMic').textContent = micOn ? '麦克风 开' : '麦克风 关';
  $('btnMic').className = micOn ? 'on' : '';
};

$('btnSpeaker').onclick = () => {
  speakerOn = !speakerOn;
  $('btnSpeaker').textContent = speakerOn ? '扬声器 开' : '扬声器 关';
  $('btnSpeaker').className = speakerOn ? 'on' : '';
};

$('quality').onchange = async () => { if (running) { await openCamera(); log('分辨率已切换'); } };
$('fpsSel').onchange = () => { if (running) startPush(); };

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running) keepAwake();
});

connect();

// 支持 ?auto=1 自动开始，免去手动点击（部分手机浏览器交互不可控时很有用）
if (/[?&]auto=1/.test(location.search)) {
  setTimeout(function () { start(); }, 800);
}
</script>
</body>
</html>
